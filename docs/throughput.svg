<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" role="img" aria-label="List endpoint throughput at 50 concurrent users: before, 702 requests per second with 51 SQL queries per page; after, 4054 requests per second with 2 SQL queries per page.">
  <style>
    :root { color-scheme: light dark; }
    .bg    { fill: #ffffff; }
    .card  { fill: #f6f8fa; stroke: #d1d9e0; }
    .title { fill: #1f2328; font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sub   { fill: #59636e; font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .lab   { fill: #1f2328; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .meta  { fill: #59636e; font: 400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .val   { fill: #1f2328; font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .valin { fill: #ffffff; font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .foot  { fill: #59636e; font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .barA  { fill: #9ba4b0; }
    .barB  { fill: #00863d; }
    .rule  { stroke: #d1d9e0; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .card  { fill: #151b23; stroke: #2f3742; }
      .title { fill: #e6edf3; }
      .sub   { fill: #9198a1; }
      .lab   { fill: #e6edf3; }
      .meta  { fill: #9198a1; }
      .val   { fill: #e6edf3; }
      .valin { fill: #0d1117; }
      .foot  { fill: #9198a1; }
      .barA  { fill: #4a5462; }
      .barB  { fill: #3fb950; }
      .rule  { stroke: #2f3742; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="316"/>
  <rect class="card" x="0.5" y="0.5" width="759" height="315" rx="8"/>

  <text class="title" x="28" y="42">List endpoint throughput</text>
  <text class="sub"   x="28" y="64">GET /listings, 50 concurrent users, 30s, against 1,000,000 rows</text>

  <line class="rule" x1="28" y1="82" x2="732" y2="82"/>

  <!-- scale: 546px maps to 4054 req/s -->

  <!-- before -->
  <text class="lab"  x="28" y="122">Before</text>
  <text class="meta" x="28" y="140">51 queries</text>
  <text class="meta" x="28" y="156">per page</text>
  <rect class="barA" x="150" y="104" width="95" height="46" rx="4"/>
  <text class="val"  x="261" y="133">702 req/s</text>

  <!-- after -->
  <text class="lab"  x="28" y="212">After</text>
  <text class="meta" x="28" y="230">2 queries</text>
  <text class="meta" x="28" y="246">per page</text>
  <rect class="barB" x="150" y="194" width="546" height="46" rx="4"/>
  <text class="valin" x="166" y="223">4,054 req/s</text>

  <line class="rule" x1="28" y1="272" x2="732" y2="272"/>
  <text class="foot" x="28" y="296">5.8x throughput, p95 latency 82.8ms to 22.1ms. Both sides measured on the same rig; method and full results in docs/benchmarks.md</text>
</svg>
